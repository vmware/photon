- archive: photon-jitterentropy-v6.12-3.tar.gz
  archive_sha512sum:
    19d79f1b2706621a2de90781a76a5d4fa3f8689f41340828db30536e0dfabd026ead5762a46644fe2240391d518821b96ffe72d25ec46e404975119eaaa12368
  skip_validation: true
  spdx:
    package:
      detailed_description: A JitterEntropy is a software-based random number
        generator that derives entropy from the unpredictable fluctuations
        (jitter) in a system's timing or clock signals. The RNG is based on a
        high-resolution timer like the x86 RDTSC instruction. The generated
        random bit stream does not show any statistical significant patterns.
        The output of the random number generator passes all standard
        statistical tools analyzing the quality of a random data stream.
      home_page: https://github.com/vmware/photon
      license_concluded: (BSD-3-Clause OR GPL-2.0-only) AND GPL-2.0-only AND
        GPL-2.0-or-later
      license_declared: (BSD-3-Clause OR GPL-2.0-only) AND GPL-2.0-only AND
        GPL-2.0-or-later
      short_summary: A JitterEntropy is a reliable, software based random number
        generator that uses the randomness of CPU jitter to produce
        cryptographically secure random numbers, ensuring robust security in
        systems that rely on high-quality entropy for encryption and other
        sensitive operations.
      supplier: 'Organization: Broadcom, Inc.'
