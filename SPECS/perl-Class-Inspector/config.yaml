      license_declared: (Artistic-1.0 OR GPL-1.0-or-later) AND 
                         (Artistic-1.0-Perl OR GPL-1.0-or-later) AND 
                         Artistic-1.0 AND GPL-1.0-only
      short_summary: Class::Inspector - Get information about a class and its structure
      supplier: 'Organization: Broadcom, Inc.'
