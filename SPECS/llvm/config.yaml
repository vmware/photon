  spdx:
    package:
      short_summary: SPIRV-LLVM-Translator is a library and tool for converting between LLVM IR and SPIR-V.
      detailed_description: SPIRV-LLVM-Translator provides both a library and a command-line tool (llvm-spirv) for translating LLVM Intermediate Representation (IR) to and from SPIR-V, the binary intermediate language used by Vulkan and OpenCL. It is essential for toolchains that target SPIR-V from LLVM-based languages or need to consume SPIR-V in LLVM-based environments.
      home_page: https://github.com/KhronosGroup/SPIRV-LLVM-Translator
