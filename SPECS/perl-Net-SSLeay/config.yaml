  name: Net-SSLeay-1.96
  version: 1.96
  url: https://cpan.metacpan.org/authors/id/C/CH/CHRISN/Net-SSLeay-1.96.tar.gz
  repo_url: https://github.com/radiator-software/p5-net-ssleay.git
