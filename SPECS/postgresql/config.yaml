        WITH Autoconf-exception-generic AND Apache-2.0 WITH LLVM-exception AND X11
        AND PostgreSQL AND TCL AND BSD-2-Clause-Views AND NCSA AND BSD-2-Clause AND
        Apache-2.0 AND FSFUL AND ISC
      short_summary: PostgreSQL database engine
      supplier: 'Organization: Broadcom, Inc.'
