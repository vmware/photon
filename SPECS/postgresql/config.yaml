  archive_sha512sum: 800f58b7651babafcca43411d6215474422e57ed16e5af246bf8beb72afaf844ca325d5d02443089fb9848d0b42872f0251aaa873a79f5094806fcdd2e10ed4b
  name: postgresql-13.21
  version: 13.21
  url: http://ftp.postgresql.org/pub/source/v13.21/postgresql-13.21.tar.bz2
  repo_url: https://github.com/postgres/postgres.git
  commit_id: 8b3c5d9f5299666e2c548cc6e18d837d52f2ab2e
  missing: []
  spdx:
    package:
      detailed_description: PostgreSQL is an advanced Object-Relational database management
        system (DBMS). The base postgresql package contains the client programs that
        you'll need to access a PostgreSQL DBMS server. These client programs can
        be located on the same machine as the PostgreSQL server, or on a remote machine
        that accesses a PostgreSQL server over a network connection. The PostgreSQL
        server can be found in the postgresql13-server sub-package.  If you want to
        manipulate a PostgreSQL database on a local or remote PostgreSQL server, you
        need this package. You also need to install this package if you're installing
        the postgresql13-server package.
      home_page: www.postgresql.org
      license_concluded: (Artistic-1.0-Perl OR GPL-1.0-or-later) AND MIT AND GPL-3.0-or-later
        WITH Autoconf-exception-generic-3.0 AND BSD-3-Clause AND GPL-1.0-or-later
        AND BSL-1.0 AND Spencer-99 AND Martin-Birgmeier AND GPL-3.0-or-later WITH
        Bison-exception-2.2 AND GPL-3.0-or-later WITH Autoconf-exception-2.0 AND GPL-2.0-or-later
        WITH Autoconf-exception-generic AND Apache-2.0 WITH LLVM-exception AND X11
        AND PostgreSQL AND TCL AND BSD-2-Clause-Views AND NCSA AND BSD-2-Clause AND
        Apache-2.0 AND FSFUL AND ISC
