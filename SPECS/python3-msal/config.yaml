  spdx:
    package:
      detailed_description: 'The Microsoft Authentication Library for Python enables applications
                             to integrate with the Microsoft identity platform. It allows you to
                             sign in users or apps with Microsoft identities (Microsoft Entra ID,
                             External identities, Microsoft Accounts and Azure AD B2C accounts)
                             and obtain tokens to call Microsoft APIs such as Microsoft Graph or
                             your own APIs registered with the Microsoft identity platform. It is
                             built using industry standard OAuth2 and OpenID Connect protocols'
      home_page: https://github.com/AzureAD/microsoft-authentication-library-for-python
      license_concluded: MIT
      license_declared: MIT
      short_summary: 'The Microsoft Authentication Library for Python enables applications
                      to integrate with the Microsoft identity platform.'
      supplier: 'Organization: Broadcom, Inc.'
