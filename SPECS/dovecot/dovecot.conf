## Dovecot configuration file

# Dovecot configuration version. Must be the first setting in the file.
dovecot_config_version = @DOVECOT_CONFIG_VERSION@

# Dovecot storage version. Keep at the oldest Dovecot version in the cluster
# until all nodes are upgraded and rollback is no longer needed.
dovecot_storage_version = @DOVECOT_CONFIG_VERSION@

!include_try conf.d/*.conf

# Enable IMAP and POP3. lmtp is intentionally omitted here because its binary
# ships in the separate dovecot-lmtpd subpackage; add it back after installing
# dovecot-lmtpd if you want LMTP delivery.
protocols {
  imap = yes
  pop3 = yes
}

# Deliver mail to the traditional Unix mbox spool for system users.
mail_driver = mbox
mail_path = ~/mail
mail_inbox_path = /var/mail/%{user}

namespace inbox {
  inbox = yes
  separator = /
}

# Address used by dovecot-lda/LMTP as the envelope sender of bounce messages.
postmaster_address = postmaster@localhost

# Authenticate system users via PAM; resolve uid/gid/home from passwd.
passdb pam {
}
userdb passwd {
}
