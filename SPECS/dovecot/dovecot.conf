## Dovecot configuration file
## See https://doc.dovecot.org/ for full documentation
## Run "doveconf -n" to list only settings that differ from the defaults.

# Protocols we want to be serving. lmtp is intentionally omitted here because
# its service binary ships in the separate dovecot-lmtpd subpackage; listing it
# without that package installed makes the daemon fail to start. Local delivery
# from an MTA is handled by dovecot-lda (no running protocol needed). Add lmtp
# back here after installing dovecot-lmtpd if you want LMTP delivery.
protocols = imap pop3

# Location of users' mailboxes. INBOX is delivered to the traditional system
# mbox (/var/mail/%u) so that an MTA (e.g. sendmail using dovecot-lda) performs
# local delivery there; other mailboxes live under ~/mail.
mail_location = mbox:~/mail:INBOX=/var/mail/%u

# Address used by dovecot-lda/LMTP as the envelope sender of bounce and
# rejection messages. dovecot-lda refuses to run without it.
postmaster_address = postmaster@localhost

# Authentication databases. Resolve local system accounts (uid/gid/home) so an
# MTA can deliver to them via "dovecot-lda -d <user>", and allow PAM-based
# logins for IMAP/POP3. Normally these live in conf.d/auth-system.conf.ext,
# but Photon ships a single self-contained dovecot.conf.
passdb {
  driver = pam
}
userdb {
  driver = passwd
}

# A comma separated list of IPs or hosts where to listen in for connections.
# "*" listens in all IPv4 interfaces, "::" listens in all IPv6 interfaces.
# If you want to specify non-default ports or anything more complex,
# edit conf.d/master.conf.
#listen = *, ::

# Base directory where to store runtime data.
#base_dir = /var/run/dovecot/

# Name of this instance. Used in multi-instance setups with doveadm -i.
#instance_name = dovecot

# Greeting message for clients.
#login_greeting = Dovecot ready.

# Space separated list of trusted network ranges. Connections from these
# IPs are allowed to override their IP addresses and ports (for logging and
# for authentication checks). disable_plaintext_auth is also ignored for
# these networks. Typically you'd specify your IMAP proxy servers here.
#login_trusted_networks =

# Space separated list of login access check sockets (e.g. tcpwrap)
#login_access_sockets =

# With proxy_maybe=yes if proxy destination matches any of these IPs, don't do
# proxying. This isn't necessary normally, but may be useful if the destination
# IP is e.g. a load balancer's IP.
#auth_proxy_self =

# Show more verbose process titles (in ps). Currently shows user name and
# IP address. Useful for seeing who are actually using the IMAP processes
# (eg. shared mailboxes or if same uid is used for multiple accounts).
#verbose_proctitle = no

# Should all processes be killed when Dovecot master process shuts down.
# Setting this to "no" means that Dovecot can be upgraded without
# forcing existing client connections to close (although that could also be
# a problem if the upgrade is e.g. because of a security fix).
#shutdown_clients = yes

# If non-zero, run mail commands via this many connections to doveadm server,
# instead of running them directly in the same process.
#doveadm_worker_count = 0
# UNIX socket or host:port used for connecting to doveadm server
#doveadm_socket_path = doveadm-server

# Space separated list of environment variables that are preserved on Dovecot
# startup and passed down to all of its child processes. You can also give
# key=value pairs to always set specific settings.
#import_environment = TZ

##
## Dictionary server settings
##

# Dictionary can be used to store key=value lists. This is used by several
# plugins. The dictionary can be accessed either directly or through a
# dictionary server. The following dict block maps dictionary names to URIs
# when the server is used. These can then be referenced using URIs in format
# "proxy::<name>".

dict {
  #quota = mysql:/etc/dovecot/dovecot-dict-sql.conf.ext
}

# Most of the actual configuration gets included below. The filenames are
# first sorted by their ASCII value and parsed in that order. The 00-prefixes
# in filenames are intended to make it easier to understand the ordering.
# Use !include_try so that an empty or absent conf.d directory is not fatal.
!include_try conf.d/*.conf

# A config file can also tried to be included without giving an error if
# it's not found:
!include_try local.conf
