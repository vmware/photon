        AND GPL-2.0-only AND MIT AND BSD-3-Clause AND Linux-OpenIB AND (GPL-2.0-only
        OR BSD-2-Clause)
      short_summary: The open source linux kernel drivers for devices(ENA) used on
        AWS platforms.
