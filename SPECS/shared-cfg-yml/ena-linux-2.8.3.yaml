  spdx:
    package:
      detailed_description: AWS Linux kernel drivers for Elastic Network Adapter(ENA).
        ENA is a networking interface designed to make good use of modern CPU features
        and system architectures. The ENA device exposes a lightweight management
        interface with a minimal set of memory mapped registers and extendible command
        set through an Admin Queue.
      home_page: https://github.com/amzn/amzn-drivers
