  spdx:
    package:
      detailed_description: 'GNU parallel is a shell tool for executing jobs concurrently
        locally or using remote computers. A job is typically a single command or
        a small script that has to be run for each of the lines in the input. The
        typical input is a list of files, a list of hosts, a list of users, a list
        of URLs, or a list of tables. '
      home_page: https://www.gnu.org/software/parallel/
      license_concluded: BSD-3-Clause AND CC-BY-SA-4.0 AND FSFUL AND FSFULLR AND FSFULLRWD
        AND GFDL-1.1-or-later AND GFDL-1.3-only AND GFDL-1.3-or-later AND GPL-1.0-or-later
        AND GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic
        AND GPL-3.0-only AND GPL-3.0-or-later AND LGPL-2.1-or-later AND X11
