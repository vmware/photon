- archive: sysdig-0.34.1.tar.gz
  archive_sha512sum: 2d7c6369eb6ae85cb7fca50da049470830eb8a88002414f257e5ccf1eb438fe36890d51107ffd782b2cd3b7358094de0795641a1cb6b086a4e29b9a5b6edad4f
  skip_validation: true
  spdx:
    package:
      detailed_description: 'Sysdig is open source, system-level exploration, capture
        system state and activity from a running Linux instance. Then save, filter
        and analyze. Sysdig is scriptable in Lua and includes a command line interface
        and a powerful interactive UI, csysdig, that runs in your terminal'
      home_page: http://www.sysdig.org
      license_concluded: Apache-2.0 AND GPL-1.0-or-later AND GPL-2.0-only AND LGPL-2.0-or-later AND MIT
      license_declared: Apache-2.0 AND GPL-1.0-or-later AND GPL-2.0-only AND LGPL-2.0-or-later AND MIT
      short_summary: Sysdig is a universal system visibility tool with native support
        for containers.
      supplier: 'Organization: Broadcom, Inc.'

