  skip_validation: true
  # scancode misdetects these LGPL-2.0-or-later headers as AGPL-3.0-only
  # (3-seq fuzzy match, 95.1% score) due to the "GNU Lesser"/"GNU Library"
  # wording mix; every other pango file with the same license text matches
  # lgpl-2.0-plus_33.RULE correctly.
  license_manual_review:
  - file_paths:
    - pango-1.50.11/pango/pango-trace-private.h
    sha256sum: 6d174d1c58d6ea8af4479af207405fa9f7376255a1ce14f6170b0e851c01d399
    spdx_exp: LGPL-2.0-or-later
  - file_paths:
    - pango-1.50.11/pango/pango-trace.c
    sha256sum: 2238ec557610e2de25ef9c0cdb115fdb343b47467a85b99663267de05ebe83c9
    spdx_exp: LGPL-2.0-or-later
  spdx:
    package:
      detailed_description: 'Pango is a library for laying out and rendering of text,
        with an emphasis on internationalization. Pango can be used anywhere that
        text layout is needed, though most of the work on Pango so far has been done
        in the context of the GTK+ widget toolkit. '
      home_page: http://pango.org
      license_concluded: LGPL-2.0-or-later AND LGPL-2.0-only AND LGPL-2.1-or-later
        AND BSD-3-Clause AND OFL-1.1 AND ICU AND TCL AND Bitstream-Vera
      license_declared: LGPL-2.0-or-later AND LGPL-2.0-only AND LGPL-2.1-or-later
        AND BSD-3-Clause AND OFL-1.1 AND ICU AND TCL AND Bitstream-Vera
      short_summary: library for laying out and rendering of text.
      supplier: 'Organization: Broadcom, Inc.'
